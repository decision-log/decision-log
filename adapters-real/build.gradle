plugins { id 'java-library'; id 'io.spring.dependency-management' }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories { mavenCentral() }
dependencyManagement { imports { mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.0' } }
dependencies {
    api project(':domain')
    implementation 'org.springframework:spring-web'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.reactivestreams:reactive-streams'

    testImplementation project(':adapters-fake')      // 계약 테스트 세 벌을 한자리에서
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }
