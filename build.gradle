plugins {
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.github.node-gradle.node' version '7.1.0' apply false
}

/**
 * 경계를 빌드가 강제한다 (이슈 #2 AC).
 * 클래스패스 부재만으로는 "빌드 파일을 고치면 뚫린다" 를 못 막으므로,
 * 해결된 런타임 클래스패스를 직접 들여다본다 — 전이 의존까지 잡힌다.
 */
def frameworkFree = ['domain', 'adapters-fake', 'sim']
def banned = [
        'org.springframework', 'org.springframework.boot',
        'jakarta.servlet', 'jakarta.persistence',
        'org.hibernate', 'org.jooq',
]

subprojects { sub ->
    if (!(sub.name in frameworkFree)) return

    // java 플러그인이 붙은 뒤에 걸어야 한다 — subprojects{} 는 그 전에 돈다
    sub.plugins.withId('java') {
    sub.tasks.register('boundaryCheck') {
        group = 'verification'
        description = "${sub.name} 클래스패스에 프레임워크가 없는지 확인한다"

        // compileOnly 는 runtimeClasspath 에 안 나온다 — 둘 다 본다
        def classpaths = ['runtimeClasspath', 'compileClasspath',
                        'testRuntimeClasspath', 'testCompileClasspath']
        def cps = classpaths.collect { sub.configurations.named(it) }
        def name = sub.name
        def denied = banned

        doLast {
            def total = 0
            def hits = [] as Set
            cps.eachWithIndex { c, i ->
                def arts = c.get().resolvedConfiguration.resolvedArtifacts
                total = Math.max(total, arts.size())
                arts.collect { "${it.moduleVersion.id.group}:${it.moduleVersion.id.name}" }
                    .findAll { a -> denied.any { d -> a.startsWith(d) } }
                    .each { hits << "${classpaths[i]}: ${it}" }
            }
            if (hits) {
                throw new GradleException(
                        "경계 위반 — '${name}' 모듈에 프레임워크가 들어왔다:\n  " + hits.sort().join("\n  ") +
                        "\n\n이슈 #2 AC: 도메인·회차 시뮬레이터에 웹 프레임워크 의존이 들어가면 빌드가 실패한다.")
            }
            println "  ✓ ${name}: 프레임워크 없음 (최대 ${total} artifacts, 4개 클래스패스 검사)"
        }
    }
    sub.tasks.named('check') { dependsOn 'boundaryCheck' }
    }
}

tasks.register('boundaryCheck') {
    group = 'verification'
    dependsOn frameworkFree.collect { ":${it}:boundaryCheck" }
}
