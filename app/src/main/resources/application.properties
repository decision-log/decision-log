spring.application.name=decision-log
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start-and-stop
spring.flyway.enabled=true

# 오디오는 파일시스템에, 경로만 DB 에 (stack.md). compose 는 여기에 볼륨을 물린다.
dl.data-dir=data

# 6명 · 주 1회 · 동시 잡 1개. 큐 미들웨어 없이 인프로세스 고정 크기 풀이면 충분하다.
dl.job.workers=2

# 오염 시뮬레이터의 시드. 고정하면 같은 대본 · 같은 컨텍스트에 같은 회의록이 나온다 (ADR 0005).
dl.stt.simulator.seed=7

# 2시간 회의 오디오가 압축해서 ~50MB (stack.md) — 여유를 두고 잘린 업로드를 막는다.
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
